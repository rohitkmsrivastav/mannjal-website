<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mannjal — For Originators</title>
<meta name="ext-resource-dependency" content="mannjal-logo.png" data-resource-id="logo" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700;800&family=Newsreader:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ====================================================================
     Shared design tokens + components — kept verbatim with the homepage
     (Mannjal Homepage (Databricks).html) so this page renders identically.
     Page-specific styles live in the "For Banks page" block at the bottom.
     ==================================================================== */
  :root {
    --accent: #F5A623;
    --accent-soft: rgba(245, 166, 35, 0.14);
    --accent-line: rgba(245, 166, 35, 0.30);
    --bg: #111111;
    --band: #0B0B0B;
    --surface: #1A1A1A;
    --surface-2: #212121;
    --text: #FFFFFF;
    --text-2: #9A9A9A;
    --text-3: #6A6A6A;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --font-head: 'Roboto', system-ui, sans-serif;
    --font-body: 'Hanken Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --maxw: 1240px;
    --pad: clamp(20px, 5vw, 64px);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 18px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: #111; }
  h1,h2,h3,h4 { font-family: var(--font-head); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }
  .wrap-wide { max-width: 1440px; margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }

  /* wordmark */
  .wordmark-img { display:block; }

  /* eyebrow */
  .eyebrow { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }

  /* buttons */
  .btn { display:inline-flex; align-items:center; gap:0.5em; cursor:pointer; font-family: var(--font-body); font-weight:700; font-size:15.5px; letter-spacing:-0.01em; border-radius:8px; padding:13px 22px; border:1px solid transparent; transition: transform .14s ease, background .2s, border-color .2s, color .2s; white-space:nowrap; }
  .btn-primary { background: var(--accent); color:#14110a; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn-dark { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
  .btn-dark:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding:10px 17px; font-size:14px; }
  .link-arrow { color: var(--accent); font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:7px; transition: gap .18s ease; }
  .link-arrow:hover { gap: 11px; }

  /* section rhythm */
  .sec { padding-top: clamp(64px, 9vw, 128px); padding-bottom: clamp(64px, 9vw, 128px); }
  .band { background: var(--band); }
  .surface { background: var(--surface); }
  .sec-head { max-width: 780px; }
  .sec-head.center { margin-left:auto; margin-right:auto; text-align:center; }
  .sec-head .eyebrow { display:block; margin-bottom: 18px; }
  .sec-head h2 { font-size: clamp(30px, 4.4vw, 54px); }
  .sec-head p { color: var(--text-2); font-size: clamp(17px, 2vw, 21px); margin-top: 20px; max-width: 640px; }
  .sec-head.center p { margin-left:auto; margin-right:auto; }

  /* ============ NAV ============ */
  .nav { position: sticky; top:0; z-index:60; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom: 1px solid transparent; transition: border-color .3s, background .3s; }
  .nav.scrolled { border-bottom: 1px solid var(--border); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height: 74px; }
  .nav-left { display:flex; align-items:center; gap: 40px; }
  .nav-links { display:flex; align-items:center; gap: 30px; }
  .nav-link { font-size:15px; color: var(--text-2); font-weight:500; transition: color .18s; white-space:nowrap; }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { color: var(--text); font-weight:600; border-bottom: 2px solid var(--accent); padding-bottom: 3px; }
  .nav-right { display:flex; align-items:center; gap: 14px; }
  @media (max-width: 920px){ .nav-links { display:none; } }

  /* ============ HERO ============ */
  .hero { position: relative; padding-top: clamp(40px, 6vw, 80px); padding-bottom: clamp(56px, 8vw, 110px); overflow: hidden; }
  .hero-grid { display:grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
  .hero-eyebrow { display:flex; align-items:center; gap:11px; margin-bottom: 26px; }
  .hero-eyebrow .pip { width:7px; height:7px; border-radius:50%; background: var(--accent); flex:none; }
  .hero h1 { font-size: clamp(38px, 5.6vw, 72px); }
  .hero h1 .accent { color: var(--accent); }
  .hero-sub { color: var(--text-2); font-size: clamp(17px, 2vw, 20px); line-height:1.6; margin-top: 26px; max-width: 540px; }
  .hero-cta { display:flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
  .hero-note { margin-top: 18px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; color: var(--text-3); }
  .hero-right { position: relative; }
  .hero-dots { position:absolute; inset:-40px -200px -40px -60px; background-image: radial-gradient(rgba(255,255,255,0.10) 1.1px, transparent 1.1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse 70% 80% at 40% 50%, #000 40%, transparent 78%); mask-image: radial-gradient(ellipse 70% 80% at 40% 50%, #000 40%, transparent 78%); z-index:0; }
  .hero-frame-wrap { position: relative; z-index:1; min-width: 660px; }
  @media (max-width: 980px){
    .hero-grid { grid-template-columns: 1fr; }
    .hero-right { margin-top: 8px; }
    .hero-frame-wrap { min-width: 0; }
    .hero-dots { inset:-30px -40px; }
  }

  /* ============ APP FRAME (product UI mock) ============ */
  .app { background: #151515; border:1px solid var(--border-strong); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.8); font-family: var(--font-body); }
  .app-top { display:flex; align-items:center; justify-content:space-between; height: 42px; padding: 0 14px; border-bottom:1px solid var(--border); background:#181818; }
  .app-top .left { display:flex; align-items:center; gap:11px; }
  .app-top .dot-row { display:flex; gap:6px; }
  .app-top .dot-row i { width:9px; height:9px; border-radius:50%; background: var(--border-strong); display:block; }
  .app-top .inst { font-size:11.5px; color: var(--text-2); display:flex; align-items:center; gap:7px; }
  .app-top .inst .badge { font-family: var(--font-mono); font-size:9.5px; letter-spacing:0.08em; color: var(--accent); border:1px solid var(--accent-line); border-radius:4px; padding:2px 6px; text-transform:uppercase; }
  .app-top .right { display:flex; align-items:center; gap:9px; }
  .app-top .avatar { width:22px; height:22px; border-radius:50%; background: linear-gradient(135deg, #2a2a2a, #3a3a3a); border:1px solid var(--border-strong); }
  .app-body { display:grid; grid-template-columns: 168px 1fr; min-height: 360px; }
  .app-side { background:#121212; border-right:1px solid var(--border); padding: 14px 10px; display:flex; flex-direction:column; gap:3px; }
  .app-side .grp { font-family: var(--font-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color: var(--text-3); padding: 10px 8px 5px; }
  .app-nav { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px; font-size:12.5px; color: var(--text-2); cursor:default; }
  .app-nav .ic { width:14px; height:14px; flex:none; opacity:.8; }
  .app-nav.active { background: var(--accent-soft); color: var(--text); }
  .app-nav.active .ic { opacity:1; }
  .app-main { padding: 18px 18px; min-width:0; }
  .app-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .app-h .t { font-family: var(--font-head); font-weight:700; font-size:17px; color: var(--text); letter-spacing:-0.01em; }
  .app-h .mini-btn { font-size:11px; font-weight:600; color:#14110a; background: var(--accent); border-radius:6px; padding:6px 11px; }
  .app-tiles { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .app-tile { background:#181818; border:1px solid var(--border); border-radius:9px; padding:11px 12px; }
  .app-tile .lab { font-size:10px; color: var(--text-3); text-transform:uppercase; letter-spacing:0.08em; font-family: var(--font-mono); }
  .app-tile .val { font-family: var(--font-head); font-weight:700; font-size:21px; margin-top:6px; letter-spacing:-0.02em; }
  .app-tile .val b { color: var(--accent); font-weight:700; }
  .app-chart { background:#181818; border:1px solid var(--border); border-radius:9px; padding:12px 12px 6px; margin-bottom:14px; }
  .app-chart .ch-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .app-chart .ch-h .ct { font-size:11.5px; color: var(--text-2); font-weight:600; }
  .app-chart .ch-h .cl { font-family: var(--font-mono); font-size:10px; color: var(--accent); }
  .app-table { background:#181818; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .app-row { display:grid; grid-template-columns: 1.4fr 1fr auto; gap:10px; align-items:center; padding:9px 13px; border-top:1px solid var(--border); font-size:12px; }
  .app-row:first-child { border-top:none; background:#1c1c1c; color: var(--text-3); font-family: var(--font-mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; }
  .app-row .nm { color: var(--text); font-weight:600; }
  .app-row .amt { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .pill { font-size:10px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill.ok { background: rgba(245,166,35,0.14); color: var(--accent); }
  .pill.live { background: rgba(120,200,140,0.12); color:#7fc89a; }
  .pill.wait { background: rgba(255,255,255,0.06); color: var(--text-2); }

  /* ============ CHIPS (shared) ============ */
  .chip { font-size:13.5px; color: var(--text); background: var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:8px 15px; font-weight:500; }
  .chip .ck { color: var(--accent); margin-right:7px; font-weight:700; }

  /* ============ FINAL CTA + FAQ (shared close styles) ============ */
  .cta-card { background: var(--surface); border:1px solid var(--border); border-radius:22px; }

  /* ============ FOOTER ============ */
  footer.site { background: var(--band); border-top:1px solid var(--border); padding: clamp(48px,6vw,80px) 0 40px; }
  .foot-grid { display:grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 32px; }
  @media (max-width: 860px){ .foot-grid { grid-template-columns: 1fr 1fr; gap:28px; } }
  .foot-brand .tagline { color: var(--text-2); font-size:14.5px; margin-top:16px; max-width:240px; line-height:1.55; }
  .foot-brand .socials { display:flex; gap:10px; margin-top:20px; }
  .foot-brand .soc { width:32px; height:32px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; color: var(--text-2); transition: all .18s; }
  .foot-brand .soc:hover { color: var(--accent); border-color: var(--accent-line); }
  .foot-col h5 { font-family: var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color: var(--accent); margin:0 0 16px; }
  .foot-col a { display:block; color: var(--text-2); font-size:14.5px; padding:6px 0; transition: color .18s; }
  .foot-col a:hover { color: var(--text); }
  .foot-bottom { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-top: clamp(40px,5vw,64px); padding-top: 26px; border-top:1px solid var(--border); }
  .foot-bottom .fine { color: var(--text-3); font-size:13px; }
  .foot-bottom .legal { display:flex; gap:22px; flex-wrap:wrap; }
  .foot-bottom .legal a { color: var(--text-3); font-size:13px; transition: color .18s; }
  .foot-bottom .legal a:hover { color: var(--text-2); }

  /* ====================================================================
     For Banks page — page-specific sections
     ==================================================================== */

  /* trust strip */
  .bankstrip { background: var(--band); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .bankstrip-grid { display:grid; grid-template-columns: repeat(3,1fr); }
  .bankstrip-cell { padding: clamp(30px,4vw,48px) clamp(16px,3vw,32px); text-align:center; }
  .bankstrip-cell + .bankstrip-cell { border-left:1px solid var(--border); }
  .bankstrip-cell .num { font-family: var(--font-head); font-weight:800; font-size: clamp(36px,5vw,58px); letter-spacing:-0.03em; line-height:1; color: var(--accent); white-space:nowrap; }
  .bankstrip-cell .num.num-txt { font-size: clamp(22px,2.8vw,34px); letter-spacing:-0.02em; }
  .bankstrip-cell .cap { margin-top:13px; font-family: var(--font-mono); font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color: var(--text-2); }
  @media (max-width:720px){
    .bankstrip-grid { grid-template-columns:1fr; }
    .bankstrip-cell + .bankstrip-cell { border-left:none; border-top:1px solid var(--border); }
  }

  /* problem intro line */
  .mx-lead { color: var(--text); font-size: clamp(17px,2vw,20px); line-height:1.55; max-width: 60ch; margin-top: clamp(28px,3.4vw,40px); }
  .mx-lead b { color: var(--accent); font-weight:600; }

  /* ===== comparison table — featured column (FleetPanda-style) ===== */
  .cmp { margin-top: clamp(34px,4vw,52px); }
  .cmp-grid { display:grid; grid-template-columns: 150px 1fr 1fr; column-gap: clamp(16px,2.2vw,30px); }
  .cmp-row { display:contents; }
  .cmp-cell { padding:18px 24px; }

  /* far-left category labels */
  .cmp-cell.label { display:flex; align-items:center; padding-left:0; padding-right:14px; }
  .cmp-lab { font-weight:700; font-size:15px; color: var(--accent); letter-spacing:-0.01em; line-height:1.25; }

  /* headers */
  .cmp-row.head .cmp-cell { text-align:center; padding-top:20px; padding-bottom:20px; }
  .cmp-hh { display:block; font-family: var(--font-head); font-weight:800; font-size: clamp(18px,2vw,22px); letter-spacing:-0.01em; }
  .cmp-cell.mj .cmp-hh { color:#14110a; }
  .cmp-cell.today .cmp-hh { color: var(--text-2); }

  /* featured column = On Mannjal (amber frame, clean cells) */
  .cmp-cell.mj { background: var(--surface); border-left:1.5px solid var(--accent); border-right:1.5px solid var(--accent); }
  .cmp-row.head .cmp-cell.mj { background: var(--accent); border-top:1.5px solid var(--accent); border-top-left-radius:14px; border-top-right-radius:14px; }
  .cmp-row.body .cmp-cell.mj { border-top:1px solid var(--accent-line); }
  .cmp-row.last .cmp-cell.mj { border-bottom:1.5px solid var(--accent); border-bottom-left-radius:14px; border-bottom-right-radius:14px; }

  /* comparison column = Today (recessed, darker than featured) */
  .cmp-cell.today { background: var(--band); border-left:1px solid var(--border); border-right:1px solid var(--border); }
  .cmp-row.head .cmp-cell.today { background:#232323; border-top:1px solid var(--border); border-top-left-radius:14px; border-top-right-radius:14px; }
  .cmp-row.body .cmp-cell.today { border-top:1px solid var(--border); }
  .cmp-row.last .cmp-cell.today { border-bottom:1px solid var(--border); border-bottom-left-radius:14px; border-bottom-right-radius:14px; }

  /* body text + bold emphasis */
  .cmp-cell p { margin:0; font-size:13.5px; line-height:1.6; }
  .cmp-cell.mj p { color: var(--text); }
  .cmp-cell.mj b { color: var(--accent); font-weight:700; }
  .cmp-cell.today p { color: var(--text-2); }
  .cmp-cell.today b { color: var(--text); font-weight:700; }

  .cmp-tag { display:none; }
  .cmp-cap { text-align:center; margin-top: clamp(28px,3.2vw,42px); font-size:14.5px; color: var(--text-3); }
  .cmp-cap b { color: var(--accent); font-weight:600; }

  @media (max-width:820px){
    .cmp-grid { display:block; }
    .cmp-row { display:block; margin-bottom:14px; }
    .cmp-row.head { display:none; }
    .cmp-cell { padding:16px 18px; border:none; }
    .cmp-cell.label { padding:0 0 10px; }
    .cmp-cell.mj { border:1.5px solid var(--accent); border-radius:12px; margin-bottom:10px; }
    .cmp-cell.today { border:1px solid var(--border); border-radius:12px; }
    .cmp-row.body .cmp-cell.mj, .cmp-row.last .cmp-cell.mj, .cmp-row.body .cmp-cell.today, .cmp-row.last .cmp-cell.today { border-top:none; border-radius:12px; }
    .cmp-tag { display:block; font-family: var(--font-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px; }
    .cmp-tag.mj { color: var(--accent); }
    .cmp-tag.today { color: var(--text-3); }
  }

  /* metrics */
  .metric-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:22px; margin-top: clamp(36px,4vw,56px); }
  @media (max-width:860px){ .metric-grid { grid-template-columns:1fr; } }
  .metric-card { background: var(--surface); border:1px solid var(--border); border-radius:18px; padding: clamp(26px,3vw,38px); display:flex; flex-direction:column; }
  .metric-card .mv { font-family: var(--font-head); font-weight:800; font-size: clamp(38px,4.6vw,56px); letter-spacing:-0.03em; line-height:1; color: var(--accent); white-space:nowrap; }
  .metric-card .md { margin-top:18px; color: var(--text-2); font-size:15.5px; line-height:1.62; }
  .metric-card .md b { color: var(--text); font-weight:600; }
  /* product-grounded fragment, pinned to the bottom so cards align */
  .metric-mini { margin-top:auto; padding-top: clamp(22px,3vw,28px); }
  .metric-mini .mm-h { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px; }
  .mm-k { font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--text-3); }
  .mm-v { font-family: var(--font-mono); font-size:11px; color: var(--text-2); }
  .mm-v.amber { color: var(--accent); }
  .mm-track { display:block; height:8px; border-radius:999px; background: var(--surface-2); overflow:hidden; }
  .mm-fill { display:block; height:100%; border-radius:999px; background: var(--accent); }
  .mm-fill.mute { background: var(--border-strong); }
  /* bars */
  .mm-bar + .mm-bar { margin-top:14px; }
  .mm-bar-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
  .mm-bar-h .k { font-size:12.5px; color: var(--text-2); }
  .mm-bar-h .v { font-family: var(--font-mono); font-size:11px; color: var(--text-3); }
  .mm-bar-h .v.amber { color: var(--accent); }
  /* meter legend */
  .mm-legend { display:flex; gap:20px; margin-top:12px; }
  .mm-legend span { display:flex; align-items:center; gap:7px; font-size:11.5px; color: var(--text-2); }
  .mm-legend i { width:8px; height:8px; border-radius:50%; background: var(--accent); flex:none; }
  .mm-legend i.mute { background: var(--border-strong); }
  /* timeline */
  .mm-rail { position:relative; height:8px; border-radius:999px; background: var(--surface-2); }
  .mm-rail-fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background: var(--accent); }
  .mm-flag { position:absolute; top:50%; transform:translate(-50%,-50%); width:12px; height:12px; border-radius:50%; background: var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .mm-scale { display:flex; justify-content:space-between; margin-top:11px; font-family: var(--font-mono); font-size:10.5px; color: var(--text-3); }
  .mm-scale .amber { color: var(--accent); }

  /* CRO reassurance band */
  .cro-card { background: var(--surface); border:1px solid var(--border); border-radius:22px; padding: clamp(30px,4vw,52px); display:grid; grid-template-columns: auto 1fr; gap: clamp(24px,4vw,48px); align-items:start; }
  .cro-seal { width:64px; height:64px; border-radius:16px; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; flex:none; }
  .cro-body h2 { font-size: clamp(26px,3.2vw,40px); max-width: 16ch; }
  .cro-body h2 .accent { color: var(--accent); }
  .cro-body p { color: var(--text-2); font-size: clamp(16px,1.9vw,19px); line-height:1.62; margin-top:18px; max-width: 60ch; }
  .cro-chips { display:flex; flex-wrap:wrap; gap:9px; margin-top:26px; }
  @media (max-width:760px){ .cro-card { grid-template-columns:1fr; gap:22px; } }

  /* final cta */
  .bank-cta { text-align:center; }
  .bank-cta h2 { font-size: clamp(30px,4.8vw,58px); max-width: 760px; margin:0 auto; }
  .bank-cta h2 .accent { color: var(--accent); }
  .bank-cta p { color: var(--text-2); font-size: clamp(17px,2vw,20px); margin: 22px auto 0; max-width: 460px; }
  .bank-cta .hero-cta { justify-content:center; margin-top: 34px; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const LOGO = (window.__resources && window.__resources.logo) || "mannjal-logo.png";

/* ---- shared line-icon set (mirrors db-appframe.jsx) ---- */
function Ic({ k, s = 16, c = "currentColor", sw = 1.6 }) {
  const p = { width: s, height: s, viewBox: "0 0 24 24", fill: "none", stroke: c, strokeWidth: sw, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    grid: <><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
    branch: <><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="9" r="2.4"/><path d="M6 8.4v7.2M8.4 6H14a2 2 0 0 1 2 2v.6"/></>,
    shield: <><path d="M12 3l7 3v5c0 4.4-3 7.4-7 9-4-1.6-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></>,
    wallet: <><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14" r="1.3"/></>,
    chart: <><path d="M4 19V5M4 19h16"/><path d="M8 16l3.5-4 3 2.5L20 8"/></>,
    doc: <><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 16h6"/></>,
    users: <><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 6.5a3 3 0 0 1 0 5.5M21 19a5.5 5.5 0 0 0-4-5.3"/></>,
    bank: <><path d="M3 9l9-5 9 5"/><path d="M5 9v8M10 9v8M14 9v8M19 9v8"/><path d="M3 20h18"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></>,
    lock: <><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15.5" r="1.2"/></>,
    layers: <><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></>,
    plus: <><path d="M12 5v14M5 12h14"/></>,
    search: <><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></>,
    link: <><rect x="3" y="9" width="7" height="6" rx="2"/><rect x="14" y="9" width="7" height="6" rx="2"/><path d="M10 12h4"/></>,
    arrow: <><path d="M5 12h14M13 6l6 6-6 6"/></>,
    check: <><path d="M5 12l4 4L19 7"/></>,
    x: <><path d="M6 6l12 12M18 6L6 18"/></>,
  };
  return <svg {...p}>{paths[k] || paths.grid}</svg>;
}

function Wordmark({ size = 26, style }) {
  return <img src={LOGO} alt="Mannjal" className="wordmark-img" style={{ height: size, width: "auto", ...style }} />;
}

/* ---- product-UI mock: an originator's instance, pipeline across many lenders ---- */
const SIDE = [
  { grp: "Originator instance" },
  { name: "Pipeline", icon: "branch" },
  { name: "Lenders", icon: "bank" },
  { name: "Applications", icon: "doc" },
  { name: "Documents", icon: "layers" },
  { name: "Reporting", icon: "chart" },
  { grp: "Account" },
  { name: "Team", icon: "users" },
  { name: "Settings", icon: "settings" },
];
const BANK_VIEW = {
  active: "Pipeline",
  title: "Lender pipeline",
  tiles: [["Active lenders", <><b>20</b>+</>], ["Live programs", <>8</>], ["Avg. to live", <><b>1.5</b>wk</>]],
  rows: [
    ["Application", "Lender", "Status"],
    ["MSME · Pune", "Bank · co-lend", ["live", "Sanctioned"]],
    ["Agri FPO · Nashik", "SFB · BC", ["ok", "In review"]],
    ["Housing · Surat", "NBFC · DA", ["live", "Disbursed"]],
    ["MSME · Indore", "New partner", ["wait", "Onboarding"]],
  ],
};

function AppFrame() {
  const v = BANK_VIEW;
  return (
    <div className="app">
      <div className="app-top">
        <div className="left">
          <div className="dot-row"><i></i><i></i><i></i></div>
          <span className="inst"><img src={LOGO} alt="Mannjal" style={{ height: 13, width: "auto", display: "block" }} /><span className="badge">secure instance</span></span>
        </div>
        <div className="right">
          <Ic k="search" s={14} c="var(--text-3)" />
          <Ic k="plus" s={14} c="var(--text-3)" />
          <div className="avatar"></div>
        </div>
      </div>
      <div className="app-body">
        <div className="app-side">
          {SIDE.map((it, i) => it.grp
            ? <div className="grp" key={i}>{it.grp}</div>
            : <div className={`app-nav ${it.name === v.active ? "active" : ""}`} key={i}>
                <span className="ic"><Ic k={it.icon} s={14} c={it.name === v.active ? "var(--accent)" : "var(--text-3)"} /></span>{it.name}
              </div>
          )}
        </div>
        <div className="app-main">
          <div className="app-h">
            <div className="t">{v.title}</div>
            <div className="mini-btn">+ New program</div>
          </div>
          <div className="app-tiles">
            {v.tiles.map((t, i) => <div className="app-tile" key={i}><div className="lab">{t[0]}</div><div className="val">{t[1]}</div></div>)}
          </div>
          <div className="app-table">
            {v.rows.map((r, i) => (
              <div className="app-row" key={i}>
                <span className="nm">{r[0]}</span>
                <span className="amt">{r[1]}</span>
                {i === 0 ? <span>{r[2]}</span> : <span className={`pill ${r[2][0]}`}>{r[2][1]}</span>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ NAV ============ */
function Nav({ onCta }) {
  const [sc, setSc] = useState(false);
  useEffect(() => {
    const f = () => setSc(window.scrollY > 12);
    window.addEventListener("scroll", f, { passive: true }); f();
    return () => window.removeEventListener("scroll", f);
  }, []);
  return (
    <nav className={`nav ${sc ? "scrolled" : ""}`}>
      <div className="wrap nav-inner">
        <div className="nav-left">
          <a href="index.html" aria-label="Mannjal home"><Wordmark size={26} /></a>
          <div className="nav-links">
            <a className="nav-link" href="for-banks.html">For banks</a>
            <a className="nav-link active" href="#top" aria-current="page">For originators</a>
            <a className="nav-link" href="how-it-works.html">How it works</a>
            <a className="nav-link" href="platform-security.html">Platform &amp; security</a>
          </div>
        </div>
        <div className="nav-right">
          <button className="btn btn-primary btn-sm" onClick={onCta}>Join the network</button>
        </div>
      </div>
    </nav>
  );
}

/* ============ HERO ============ */
function Hero({ onCta }) {
  return (
    <section className="hero wrap-wide" id="top">
      <div className="hero-grid">
        <div>
          <div className="hero-eyebrow"><span className="pip"></span><span className="eyebrow">For originators</span></div>
          <h1>Reach the right lenders <span className="accent">without the months of back-and-forth.</span></h1>
          <p className="hero-sub">Mannjal connects you to lenders actively building partnership programs, and gives you one structured way to work with each of them. Onboarding that once took months begins in days.</p>
          <div className="hero-cta">
            <button className="btn btn-primary" onClick={onCta}>Join the network</button>
          </div>
          <div className="hero-note">A short walkthrough of how the network fits your pipeline</div>
        </div>
        <div className="hero-right">
          <div className="hero-dots" aria-hidden="true"></div>
          <div className="hero-frame-wrap"><AppFrame /></div>
        </div>
      </div>
    </section>
  );
}

/* ============ TRUST STRIP ============ */
function TrustStrip() {
  const cells = [
    { num: "20+", cap: "Active lenders" },
    { num: "Banks & SFBs", cap: "On the network", txt: true },
    { num: "₹1,000 Cr", cap: "Disbursed" },
  ];
  return (
    <section className="bankstrip">
      <div className="wrap">
        <div className="bankstrip-grid">
          {cells.map((c) => (
            <div className="bankstrip-cell" key={c.cap}>
              <div className={`num ${c.txt ? "num-txt" : ""}`}>{c.num}</div>
              <div className="cap">{c.cap}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============ PROBLEM — featured-column comparison ============ */
const ROWS = [
  {
    label: "Preparing a file",
    mj: <>Applications arrive by field app, API, CSV or Excel. Each lender's eligibility and credit rules <b>run up front</b>, with deviations flagged and explained.</>,
    today: <>Each lender's formats and templates reconciled <b>by hand.</b> Credit memos, Key Fact Statements and repayment schedules rebuilt for every partner.</>,
  },
  {
    label: "Submitting it",
    mj: <>Bureau and KYC checks route through the lender's own providers, so a file <b>reaches the bank complete.</b></>,
    today: <>Documentation gaps surface only at the bank's credit desk, so <b>files come back for rework.</b></>,
  },
  {
    label: "After it's in",
    mj: <>Documents generate in each lender's format, queries are tracked, and <b>every action is time-stamped</b> and exportable for audit.</>,
    today: <><b>No clear view of status.</b> Progress chased over email and phone instead of sourcing the next loan.</>,
  },
  {
    label: "Time to live",
    mj: <><b>One to two weeks</b> to launch a program with a new lender.</>,
    today: <><b>Three to four months</b> of back-and-forth before a file is accepted.</>,
  },
];

function Problem() {
  return (
    <section className="sec" id="problem">
      <div className="wrap">
        <div className="sec-head">
          <span className="eyebrow">The problem we solve</span>
          <h2>Onboarding a bank shouldn't take months.</h2>
        </div>
        <p className="mx-lead">For most originators the hardest part is getting a file accepted, and that work runs across the <b>whole life of an application.</b></p>

        <div className="cmp">
          <div className="cmp-grid">
            <div className="cmp-row head">
              <div className="cmp-cell label"></div>
              <div className="cmp-cell mj"><span className="cmp-hh">On Mannjal</span></div>
              <div className="cmp-cell today"><span className="cmp-hh">Before Mannjal</span></div>
            </div>
            {ROWS.map((r, i) => (
              <div className={`cmp-row body ${i === ROWS.length - 1 ? "last" : ""}`} key={r.label}>
                <div className="cmp-cell label"><span className="cmp-lab">{r.label}</span></div>
                <div className="cmp-cell mj"><span className="cmp-tag mj">On Mannjal</span><p>{r.mj}</p></div>
                <div className="cmp-cell today"><span className="cmp-tag today">Before Mannjal</span><p>{r.today}</p></div>
              </div>
            ))}
          </div>
          <div className="cmp-cap">Same file, same lender rules. <b>Built once, instead of rebuilt for every bank.</b></div>
        </div>
      </div>
    </section>
  );
}

/* ============ METRICS ============ */
const METRICS = [
  {
    v: "50–75%", d: <>Turnaround time reduced. Cases clear in <b>a fraction of the time</b> they once took.</>,
    mini: { kind: "bars", k: "Turnaround time", bars: [{ k: "Today", v: "baseline", w: "100%", mute: true }, { k: "On Mannjal", v: "−50–75%", w: "32%" }] },
  },
  {
    v: "85–90%", d: <><b>Login-to-sanction ratio.</b> Fewer files stall in review because they're complete and accurate at submission.</>,
    mini: { kind: "meter", k: "Login to sanction", v: "85–90%", w: "88%", legend: [{ t: "Sanctioned 85–90%" }, { t: "Stalled 10–15%", mute: true }] },
  },
  {
    v: "1–2 wks", d: <>To launch a program with a new lender, where <b>three to four months</b> is typical elsewhere.</>,
    mini: { kind: "timeline", k: "Time to go live", v: "Wk 1–2", fill: "15%", left: "Live · wk 1–2", right: "Typical 3–4 mo" },
  },
];

function MetricMini({ m }) {
  return (
    <div className="metric-mini">
      {m.kind === "bars" && (
        <>
          <div className="mm-h"><span className="mm-k">{m.k}</span></div>
          {m.bars.map((b) => (
            <div className="mm-bar" key={b.k}>
              <div className="mm-bar-h"><span className="k">{b.k}</span><span className={`v ${b.mute ? "" : "amber"}`}>{b.v}</span></div>
              <span className="mm-track"><span className={`mm-fill ${b.mute ? "mute" : ""}`} style={{ width: b.w }}></span></span>
            </div>
          ))}
        </>
      )}
      {m.kind === "meter" && (
        <>
          <div className="mm-h"><span className="mm-k">{m.k}</span><span className="mm-v amber">{m.v}</span></div>
          <span className="mm-track"><span className="mm-fill" style={{ width: m.w }}></span></span>
          <div className="mm-legend">
            {m.legend.map((l) => <span key={l.t}><i className={l.mute ? "mute" : ""}></i>{l.t}</span>)}
          </div>
        </>
      )}
      {m.kind === "timeline" && (
        <>
          <div className="mm-h"><span className="mm-k">{m.k}</span><span className="mm-v amber">{m.v}</span></div>
          <div className="mm-rail">
            <span className="mm-rail-fill" style={{ width: m.fill }}></span>
            <span className="mm-flag" style={{ left: m.fill }}></span>
          </div>
          <div className="mm-scale"><span className="amber">{m.left}</span><span>{m.right}</span></div>
        </>
      )}
    </div>
  );
}

function Metrics() {
  return (
    <section className="sec" id="impact">
      <div className="wrap">
        <div className="sec-head">
          <span className="eyebrow">What changes for your team</span>
          <h2>Less chasing. More lending.</h2>
        </div>
        <div className="metric-grid">
          {METRICS.map((m) => (
            <div className="metric-card" key={m.v}>
              <div className="mv">{m.v}</div>
              <div className="md">{m.d}</div>
              <MetricMini m={m.mini} />
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============ AUDIT-READY BAND ============ */
function AuditBand() {
  const chips = ["Validated against lender policy", "Bureau & KYC pre-checked", "Documents in lender format", "Time-stamped & exportable"];
  return (
    <section className="band sec" id="audit">
      <div className="wrap">
        <div className="cro-card">
          <div className="cro-seal"><Ic k="shield" s={32} c="var(--accent)" sw={1.7} /></div>
          <div className="cro-body">
            <span className="eyebrow" style={{ display: "block", marginBottom: 16 }}>Show up audit-ready</span>
            <h2>Reach the credit committee with files <span className="accent">already in order.</span></h2>
            <p>Banks decline originators whose data and processes don't meet their credit committee's standards. Mannjal validates each application against the lender's own policy as it's built, so the file that reaches the bank already meets their requirements. That's what makes a partnership the bank can scale with confidence.</p>
            <div className="cro-chips">{chips.map((c) => <span className="chip" key={c}><span className="ck">✓</span>{c}</span>)}</div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============ FINAL CTA ============ */
function FinalCta({ onCta }) {
  return (
    <section className="band sec" id="walkthrough">
      <div className="wrap">
        <div className="bank-cta">
          <h2>Start lending with the <span className="accent">right banks</span> sooner.</h2>
          <p>A short walkthrough of how the network fits your pipeline.</p>
          <div className="hero-cta">
            <button className="btn btn-primary" onClick={onCta}>Join the network</button>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============ FOOTER ============ */
function MegaFooter() {
  const cols = [
    { h: "Platform", links: ["Co-lending", "Business Correspondent", "LSP programs", "Escrow", "Reporting"] },
    { h: "Use cases", links: ["For banks", "For originators", "MSME", "Agriculture", "Affordable housing"] },
    { h: "Company", links: ["About", "RBI 2025", "Security", "Careers", "Contact"] },
    { h: "Resources", links: ["How it works", "Compliance", "Documentation", "FAQ"] },
  ];
  return (
    <footer className="site">
      <div className="wrap">
        <div className="foot-grid">
          <div className="foot-brand">
            <Wordmark size={24} />
            <p className="tagline">Partnership lending infrastructure for banks that want to scale.</p>
            <div className="socials">
              <a className="soc" href="#walkthrough" aria-label="LinkedIn"><Ic k="users" s={15} /></a>
              <a className="soc" href="#walkthrough" aria-label="Email"><Ic k="doc" s={15} /></a>
              <a className="soc" href="#walkthrough" aria-label="Link"><Ic k="link" s={15} /></a>
            </div>
          </div>
          {cols.map((c) => (
            <div className="foot-col" key={c.h}>
              <h5>{c.h}</h5>
              {c.links.map((l) => <a href="#walkthrough" key={l}>{l}</a>)}
            </div>
          ))}
        </div>
        <div className="foot-bottom">
          <div className="fine">© 2026 Mannjal · Partnership lending infrastructure</div>
          <div className="legal">
            <a href="#walkthrough">Privacy</a>
            <a href="#walkthrough">Terms</a>
            <a href="#walkthrough">Security</a>
            <a href="#walkthrough">RBI 2025</a>
          </div>
        </div>
      </div>
    </footer>
  );
}

/* ============ APP ============ */
function App() {
  const onCta = () => {
    const el = document.getElementById("walkthrough");
    if (el) window.scrollTo({ top: el.offsetTop - 30, behavior: "smooth" });
  };
  return (
    <React.Fragment>
      <Nav onCta={onCta} />
      <Hero onCta={onCta} />
      <TrustStrip />
      <Problem />
      <AuditBand />
      <Metrics />
      <FinalCta onCta={onCta} />
      <MegaFooter />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
