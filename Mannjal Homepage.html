<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mannjal — Partnership lending infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700;800&family=Newsreader:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #F5A623;
    --accent-soft: rgba(245, 166, 35, 0.14);
    --accent-line: rgba(245, 166, 35, 0.30);
    --bg: #111111;
    --surface: #1A1A1A;
    --surface-2: #202020;
    --text: #FFFFFF;
    --text-2: #999999;
    --text-3: #6E6E6E;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --font-head: 'Spectral', Georgia, serif;
    --font-body: 'Hanken Grotesk', system-ui, sans-serif;
    --maxw: 1180px;
    --pad: clamp(20px, 5vw, 64px);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: #111; }

  h1, h2, h3, h4, .head { font-family: var(--font-head); font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; margin: 0; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }

  /* ---------- Wordmark ---------- */
  .wordmark { font-family: var(--font-head); font-weight: 800; letter-spacing: -0.03em; color: var(--text); display: inline-flex; align-items: baseline; line-height: 1; }
  .wordmark .j { position: relative; }
  .wordmark .j::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    top: -0.30em; width: 0.20em; height: 0.20em; border-radius: 50%;
    background: var(--accent);
  }
  /* mask the font's own tittle behind the amber dot for the j */
  .wordmark .j { color: var(--text); }

  .dot { color: var(--accent); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5em; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 16px; letter-spacing: -0.01em;
    border-radius: 999px; padding: 13px 24px; border: 1px solid transparent;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #14110a; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 10px 18px; font-size: 14px; }

  .eyebrow {
    font-family: var(--font-body); font-weight: 700; font-size: 13px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent);
  }
  .label-soft { color: var(--text-2); }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid transparent;
    transition: border-color .3s ease, background .3s ease;
  }
  .nav.scrolled { border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  .nav-links { display: flex; align-items: center; gap: 34px; }
  .nav-link { font-size: 15.5px; color: var(--text-2); transition: color .18s ease; font-weight: 500; white-space: nowrap; }
  .nav-link:hover { color: var(--text); }
  .nav-right { display: flex; align-items: center; gap: 18px; }
  @media (max-width: 860px) { .nav-links { display: none; } }

  /* ---------- Section rhythm ---------- */
  section { position: relative; }
  .section-pad { padding-top: clamp(72px, 11vw, 150px); padding-bottom: clamp(72px, 11vw, 150px); }
  .section-head { max-width: 760px; }
  .section-head .eyebrow { display: block; margin-bottom: 20px; }
  .section-head h2 { font-size: clamp(30px, 4.4vw, 52px); }
  .section-head p { color: var(--text-2); font-size: clamp(17px, 2vw, 21px); margin-top: 22px; max-width: 620px; }

  /* ---------- Hero shared ---------- */
  .hero { padding-top: clamp(54px, 8vw, 96px); padding-bottom: clamp(64px, 9vw, 120px); position: relative; overflow: hidden; }
  .hero-eyebrow { display:flex; align-items:center; gap:12px; margin-bottom: 30px; }
  .hero-eyebrow .pip { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .hero h1 { font-size: clamp(38px, 6.4vw, 78px); font-weight: 800; }
  .hero h1 .accent { color: var(--accent); }
  .hero-sub { color: var(--text-2); font-size: clamp(17px, 2.1vw, 21px); line-height: 1.62; margin-top: 30px; max-width: 600px; }
  .hero-cta { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }

  .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(32px, 5vw, 72px); align-items: center; }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } .hero-aside { display:none; } }

  /* hero centered variant */
  .hero-centered { text-align: center; }
  .hero-centered .hero-eyebrow { justify-content: center; }
  .hero-centered .hero-sub { margin-left: auto; margin-right: auto; }
  .hero-centered .hero-cta { justify-content: center; }
  .hero-inline-stats { display:flex; gap: clamp(28px,5vw,64px); justify-content:center; margin-top: 64px; flex-wrap: wrap; }
  .hero-inline-stats .num { font-family: var(--font-head); font-weight: 800; font-size: clamp(30px,4vw,46px); color: var(--text); letter-spacing: -0.02em; }
  .hero-inline-stats .num b { color: var(--accent); font-weight: 800; }
  .hero-inline-stats .lab { color: var(--text-2); font-size: 14px; font-weight: 500; margin-top: 4px; }

  /* ---------- Two-sides motif (hero aside / split) ---------- */
  .motif { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: stretch; }
  .motif-side {
    border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
    padding: 22px 20px; min-height: 230px; display: flex; flex-direction: column; gap: 14px;
  }
  .motif-side h5 { font-family: var(--font-head); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; color: var(--text); margin: 0; display:flex; align-items:center; gap:8px; }
  .motif-side h5::before { content:""; width: 8px; height:8px; border-radius: 2px; background: var(--text-2); }
  .motif-side .row { color: var(--text-2); font-size: 13.5px; display:flex; align-items:center; gap:9px; }
  .motif-side .row::before { content:""; width:5px; height:5px; border-radius:50%; background: var(--text-3); flex:none; }
  .motif-spine {
    width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    position: relative;
  }
  .motif-spine::before { content:""; position:absolute; top:18px; bottom:18px; width:2px; background: var(--accent-line); }
  .motif-spine .node {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--accent);
    display:flex; align-items:center; justify-content:center; position: relative; z-index:1;
  }
  .motif-spine .node i { width:9px; height:9px; border-radius:50%; background: var(--accent); display:block; font-style: normal; }
  .motif-cap { text-align:center; margin-top: 16px; font-size: 12.5px; color: var(--text-3); letter-spacing: 0.02em; }
  .motif-cap b { color: var(--accent); font-weight: 700; }

  /* ---------- Traction strip ---------- */
  .traction { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .traction-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .traction-cell { padding: clamp(40px, 6vw, 72px) clamp(20px, 3vw, 40px); text-align: center; position: relative; }
  .traction-cell + .traction-cell { border-left: 1px solid var(--border); }
  .traction-cell .num { font-family: var(--font-head); font-weight: 800; font-size: clamp(44px, 7vw, 84px); letter-spacing: -0.03em; line-height: 1; }
  .traction-cell .num b { color: var(--accent); font-weight: 800; }
  .traction-cell .lab { color: var(--text-2); font-size: clamp(14px, 1.6vw, 17px); margin-top: 16px; font-weight: 500; letter-spacing: 0.01em; }
  @media (max-width: 720px) { .traction-grid { grid-template-columns: 1fr; } .traction-cell + .traction-cell { border-left: none; border-top: 1px solid var(--border); } }

  /* ---------- RBI strip ---------- */
  .rbi { }
  .rbi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    padding: clamp(32px, 4.5vw, 56px); display: grid; grid-template-columns: auto 1fr; gap: clamp(28px, 4vw, 56px); align-items: start;
  }
  .rbi-badge { display:flex; flex-direction: column; gap: 6px; }
  .rbi-badge .tag { font-family: var(--font-body); font-weight: 800; color: var(--accent); font-size: 13px; letter-spacing: 0.14em; }
  .rbi-badge .yr { font-family: var(--font-head); font-weight: 800; font-size: clamp(40px, 6vw, 64px); line-height: 0.9; letter-spacing: -0.03em; }
  .rbi-body h3 { font-size: clamp(22px, 2.6vw, 30px); max-width: 600px; }
  .rbi-chips { display:flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .chip { font-size: 14px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px; font-weight: 500; }
  .chip .ck { color: var(--accent); margin-right: 7px; font-weight: 700; }
  .rbi-live { margin-top: 22px; color: var(--text-2); font-size: 15px; display:flex; align-items:center; gap: 9px; }
  .rbi-live .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  @media (max-width: 720px) { .rbi-card { grid-template-columns: 1fr; gap: 24px; } }

  /* ---------- Three paths ---------- */
  .paths-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: clamp(40px, 5vw, 64px); }
  @media (max-width: 900px) { .paths-grid { grid-template-columns: 1fr; } }
  .path-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: clamp(26px, 3vw, 38px); display: flex; flex-direction: column; min-height: 320px;
    transition: border-color .25s ease, transform .25s ease;
  }
  .path-card:hover { border-color: var(--border-strong); transform: translateY(-3px); }
  .path-ico { width: 50px; height: 50px; border-radius: 14px; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; margin-bottom: 26px; }
  .path-ico .glyph { display:block; }
  .path-card h3 { font-size: clamp(21px, 2.4vw, 26px); margin-bottom: 14px; }
  .path-card p { color: var(--text-2); font-size: 16px; line-height: 1.62; }
  .path-tag { font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin-bottom: 18px; }

  /* ---------- How it works diagram ---------- */
  .hiw { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

  /* Columns variant */
  .diagram-cols { display: grid; grid-template-columns: 1fr minmax(120px, 200px) 1fr; gap: 0; margin-top: clamp(44px, 5vw, 70px); align-items: stretch; }
  .side-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 22px; padding: clamp(26px, 3vw, 40px); }
  .side-panel .ph { font-family: var(--font-head); font-weight: 700; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); }
  .side-panel h4 { font-size: clamp(22px, 2.6vw, 30px); margin: 12px 0 22px; }
  .side-item { display:flex; gap: 13px; padding: 13px 0; border-top: 1px solid var(--border); }
  .side-item:first-of-type { border-top: none; }
  .side-item .si-n { font-family: var(--font-head); font-weight: 800; font-size: 13px; color: var(--accent); width: 22px; flex: none; padding-top: 1px; }
  .side-item .si-t { font-size: 15px; color: var(--text); font-weight: 600; }
  .side-item .si-d { font-size: 13.5px; color: var(--text-2); margin-top: 2px; line-height: 1.5; }
  .center-layer { display:flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px 0; }
  .center-rail { position: absolute; top: 30px; bottom: 64px; width: 2px; background: linear-gradient(var(--accent-line), var(--accent), var(--accent-line)); left: 50%; transform: translateX(-50%); }
  .center-tag { font-family: var(--font-head); font-weight: 800; color: var(--accent); font-size: 13px; letter-spacing: 0.1em; text-align:center; margin-bottom: 18px; z-index:1; }
  .center-nodes { display:flex; flex-direction: column; gap: 16px; z-index: 1; }
  .cnode { background: var(--bg); border: 1.5px solid var(--accent); color: var(--text); border-radius: 999px; padding: 9px 16px; font-size: 12.5px; font-weight: 600; font-family: var(--font-body); white-space: nowrap; text-align:center; box-shadow: 0 0 0 5px var(--surface); }
  .center-note { margin-top: 22px; font-size: 12px; color: var(--text-3); text-align:center; max-width: 160px; line-height: 1.5; z-index:1; display:flex; flex-direction:column; gap: 5px; }
  .center-note .cn-strong { color: var(--accent); font-weight: 700; }
  @media (max-width: 900px) {
    .diagram-cols { grid-template-columns: 1fr; gap: 14px; }
    .center-rail { display: none; }
    .center-layer { padding: 8px 0; }
    .center-nodes { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  }

  /* Flow variant */
  .diagram-flow { margin-top: clamp(44px, 5vw, 70px); }
  .flow-rails { display:grid; grid-template-columns: 110px 1fr; gap: 0 24px; align-items: stretch; }
  .flow-axis { display:flex; flex-direction: column; gap: 0; }
  .flow-axis .ax { flex: 1; display:flex; align-items:center; font-family: var(--font-head); font-weight: 800; font-size: 13px; letter-spacing: 0.08em; color: var(--text-2); }
  .flow-axis .ax.bank { color: var(--text); }
  .flow-track { display:grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .flow-step { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; display:flex; flex-direction: column; gap: 10px; position: relative; }
  .flow-step .fs-n { width: 30px; height: 30px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-family: var(--font-head); font-weight: 800; font-size: 14px; }
  .flow-step .fs-t { font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--text); line-height: 1.2; }
  .flow-step .fs-d { font-size: 13px; color: var(--text-2); line-height: 1.5; }
  .flow-step .fs-who { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .flow-step.bank .fs-n { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); }
  .flow-step.orig .fs-n { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); }
  .flow-step.mid { border-color: var(--accent-line); background: linear-gradient(180deg, var(--accent-soft), var(--bg)); }
  .flow-step.mid .fs-n { background: var(--accent); color: #14110a; }
  .flow-step.mid .fs-who { color: var(--accent); }
  .flow-step.bank .fs-who, .flow-step.orig .fs-who { color: var(--text-3); }
  .flow-legend { display:flex; gap: 22px; margin-top: 26px; flex-wrap: wrap; }
  .flow-legend .lg { display:flex; align-items:center; gap: 9px; font-size: 13.5px; color: var(--text-2); }
  .flow-legend .sw { width: 13px; height: 13px; border-radius: 4px; }
  @media (max-width: 900px) {
    .flow-rails { grid-template-columns: 1fr; }
    .flow-axis { display:none; }
    .flow-track { grid-template-columns: 1fr; }
  }

  /* steps list (shared, columns variant) */
  .steps { display:grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-top: clamp(40px, 5vw, 64px); border-top: 1px solid var(--border); }
  .step { padding: 28px 18px 8px 0; border-right: 1px solid var(--border); }
  .step:last-child { border-right: none; padding-right: 0; }
  .step .sn { font-family: var(--font-head); font-weight: 800; font-size: 13px; color: var(--accent); letter-spacing: 0.08em; }
  .step .st { font-family: var(--font-head); font-weight: 700; font-size: 16px; margin: 12px 0 8px; line-height: 1.2; }
  .step .sd { font-size: 13.5px; color: var(--text-2); line-height: 1.55; }
  @media (max-width: 900px) { .steps { grid-template-columns: 1fr; } .step { border-right: none; border-bottom: 1px solid var(--border); padding: 22px 0; } .step:last-child { border-bottom: none; } }

  /* ---------- Partner / investors ---------- */
  .trust { text-align: center; }
  .trust p { color: var(--text-2); font-size: clamp(17px, 2vw, 22px); max-width: 720px; margin: 0 auto; line-height: 1.5; }
  .trust p b { color: var(--text); font-weight: 600; }
  .logo-row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 48px; }
  @media (max-width: 760px) { .logo-row { grid-template-columns: repeat(2, 1fr); } }
  .logo-ph { height: 72px; border: 1px dashed var(--border-strong); border-radius: 12px; display:flex; align-items:center; justify-content:center; color: var(--text-3); font-family: 'Hanken Grotesk', monospace; font-size: 11px; letter-spacing: 0.06em; background: var(--surface); }
  .trust-note { margin-top: 22px; font-size: 13px; color: var(--text-3); }
  .trust-note a { color: var(--accent); border-bottom: 1px solid var(--accent-line); }

  .investors { text-align:center; }
  .investors .eyebrow { display:block; margin-bottom: 28px; }
  .inv-row { display:flex; flex-wrap: wrap; align-items:center; justify-content:center; gap: clamp(20px, 4vw, 52px); }
  .inv-name { font-family: var(--font-head); font-weight: 700; font-size: clamp(18px, 2.4vw, 26px); color: var(--text-2); letter-spacing: -0.01em; transition: color .2s ease; }
  .inv-name:hover { color: var(--text); }
  .inv-sep { color: var(--text-3); }

  /* ---------- Footer CTA ---------- */
  .cta-band { text-align:center; }
  .cta-band h2 { font-size: clamp(34px, 5.6vw, 68px); max-width: 880px; margin: 0 auto; }
  .cta-band h2 .accent { color: var(--accent); }
  .cta-band p { color: var(--text-2); font-size: clamp(17px, 2vw, 20px); max-width: 560px; margin: 24px auto 0; }
  .cta-band .hero-cta { justify-content:center; }

  footer.site { border-top: 1px solid var(--border); padding: 48px 0; }
  .foot-inner { display:flex; align-items:center; justify-content:space-between; gap: 24px; flex-wrap: wrap; }
  .foot-links { display:flex; gap: 26px; flex-wrap: wrap; }
  .foot-links a { color: var(--text-2); font-size: 14.5px; transition: color .18s ease; }
  .foot-links a:hover { color: var(--text); }
  .foot-fine { color: var(--text-3); font-size: 13px; }

  /* ---------- Reveal (kept static per brief — always visible) ---------- */
  .reveal { opacity: 1; transform: none; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mannjal-sections.jsx"></script>
<script type="text/babel" src="mannjal-diagram.jsx"></script>
<script type="text/babel" src="mannjal-app.jsx"></script>
</body>
</html>
